[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smaip"
version = "0.7.0"
description = "Secure Multi-Agent Inference Platform — Week 7 probe collection and training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.6",
    "langgraph>=0.2.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
hf = [
    "transformers>=4.44",
    "torch>=2.2",
    "accelerate>=0.33",
]
gpu = [
    "vllm>=0.6.3",
]

[project.scripts]
smaip = "smaip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smaip = [
    "fixture_data/vendors/*.json",
    "fixture_data/vendors/*/*.md",
    "fixture_data/week5/vendors/*.json",
    "fixture_data/week5/vendors/*/*.md",
    "fixture_data/week6/vendors/*.json",
    "fixture_data/week6/vendors/*/*.md",
    "fixture_data/week7/*.jsonl",
    "eval/suites/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "hf: optional Hugging Face CPU path; skipped unless SMAIP_RUN_HF=1",
]
