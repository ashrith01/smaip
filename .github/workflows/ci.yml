name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  week2:
    name: week2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, pytest, and eval gate
        run: make week2 PYTHON=python

  week3:
    name: week3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, pytest, eval gate, and Week 3 task suite
        run: make week3 PYTHON=python

  week4:
    name: week4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, pytest, eval gate, Week 3 suite, and Week 4 suite
        run: make week4 PYTHON=python

  week5:
    name: week5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, pytest, earlier gates, and the Week 5 suite
        run: make week5 PYTHON=python

  week6:
    name: week6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, pytest, earlier gates, and the Week 6 suite
        run: make week6 PYTHON=python

  week7:
    name: week7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Week 7 CPU smoke without a model download
        run: SMAIP_PROBE_BACKEND=mock make week7-cpu PYTHON=python

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU image
        run: docker build -t smaip:ci .
