services:
  api:
    build:
      context: .
    image: smaip:local
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
